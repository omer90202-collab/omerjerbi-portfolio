<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>דמו 3 — Collage Ring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--page:#060504;--card:#0d0b09;--ink:#f5f0e6;--dim:#6b6355;--gold:#FDBF2D}
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font-family:'Heebo',sans-serif;line-height:1.5}
  .tag{position:fixed;top:20px;inset-inline:0;text-align:center;z-index:9;font-size:12px;letter-spacing:.3em;color:var(--dim)}
  .spacer{height:60vh;display:grid;place-items:center;text-align:center}
  .spacer h1{font-size:clamp(32px,5vw,64px);font-weight:900;margin:0 0 14px}
  .spacer p{color:var(--dim);font-size:14px;letter-spacing:.2em}
  .collage-stage{height:100vh;position:relative;overflow:hidden;display:grid;place-items:center}
  .cimg{position:absolute;width:15vw;min-width:150px;max-width:230px;aspect-ratio:3/4;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.55)}
  .cimg img{width:100%;height:100%;object-fit:cover;display:block}
  .cimg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(6,5,4,.82) 0%,transparent 48%)}
  .cimg span{position:absolute;bottom:10px;inset-inline:10px;z-index:1;font-size:12px;font-weight:700}
  .collage-title{position:relative;z-index:2;text-align:center}
  .collage-title h2{font-size:clamp(30px,4.6vw,68px);font-weight:900;margin:0}
  .collage-title h2 em{font-style:normal;color:var(--gold)}
  .collage-title p{color:var(--dim);margin-top:10px;font-size:14px;letter-spacing:.1em}
  .tail{height:40vh;display:grid;place-items:center;color:var(--dim);font-size:13px;letter-spacing:.3em}
</style>
</head>
<body>
<div class="tag">דמו 3 · Collage: פיזור → הרכבה לטבעת</div>
<div class="spacer"><div><h1>מי אני</h1><p>גלול</p></div></div>

<section id="scCollage">
  <div class="collage-stage" id="collageStage">
    <div class="cimg"><img src="../images/mi-ani/graphic-design.jpg" alt=""><span>עיצוב גרפי</span></div>
    <div class="cimg"><img src="../images/mi-ani/video-editing.jpg" alt=""><span>עריכת וידיאו</span></div>
    <div class="cimg"><img src="../images/mi-ani/ai-content.jpg" alt=""><span>יצירת תוכן AI</span></div>
    <div class="cimg"><img src="../images/mi-ani/podcast-editing.jpg" alt=""><span>עריכת פודקאסטים</span></div>
    <div class="cimg"><img src="../images/mi-ani/web-dev.jpg" alt=""><span>בניית אתרים</span></div>
    <div class="cimg"><img src="../images/mi-ani/automation.jpg" alt=""><span>אוטומציות AI</span></div>
    <div class="collage-title"><h2>עומר <em>ג'רבי</em></h2><p>מומחה תוכן AI</p></div>
  </div>
</section>
<div class="tail">סוף הדמו</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.3.4/dist/lenis.min.js"></script>
<script>
window.addEventListener('load', () => {
  gsap.registerPlugin(ScrollTrigger);
  const lenis = new Lenis({ lerp:.085 });
  lenis.on('scroll', ScrollTrigger.update);
  gsap.ticker.add(t => lenis.raf(t*1000));

  const imgs = gsap.utils.toArray('.cimg');
  const finals = [
    { x:'-30vw', y:'-30vh', r:-7 }, { x:'0vw',   y:'-40vh', r:4 },  { x:'30vw',  y:'-30vh', r:-4 },
    { x:'-30vw', y:'30vh',  r:6 },  { x:'0vw',   y:'40vh',  r:-5 }, { x:'30vw',  y:'30vh',  r:8 } ];
  const scatter = [
    { x:'-90vw', y:'-75vh', r:-45 }, { x:'0vw',   y:'-100vh',r:30 }, { x:'90vw',  y:'-65vh', r:-30 },
    { x:'-90vw', y:'75vh',  r:35 },  { x:'0vw',   y:'100vh', r:-40 },{ x:'90vw',  y:'65vh',  r:45 } ];

  gsap.set(imgs, {
    x: (i) => scatter[i].x, y: (i) => scatter[i].y, rotation: (i) => scatter[i].r,
    opacity:0, scale:1.15
  });

  const tl = gsap.timeline({ scrollTrigger:{ trigger:'#scCollage', start:'top top', end:'+=220%', pin:'#collageStage', scrub:.6 } });
  imgs.forEach((im, i) => {
    tl.to(im, { x:finals[i].x, y:finals[i].y, rotation:finals[i].r, opacity:1, scale:1, ease:'power2.out', duration:1 }, i * .06);
  });
  tl.from('.collage-title', { opacity:0, scale:.85, duration:.8, ease:'power2.out' }, .4);
  tl.to(imgs, { scale:1.04, duration:.4, stagger:.02, ease:'power1.inOut' }, '+=.1');

  ScrollTrigger.refresh();
});
</script>
</body>
</html>

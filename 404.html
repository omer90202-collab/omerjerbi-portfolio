<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="robots" content="noindex">
<title>הדף לא נמצא — עומר ג'רבי</title>
<link rel="icon" href="images/favicon.png" type="image/png">
<style>
  @font-face{font-family:'TelAvivBrutalist';src:url('fonts/telaviv-brutalist-light.woff2') format('woff2');
    font-weight:100 350;font-style:normal;font-display:swap}
  @font-face{font-family:'TelAvivBrutalist';src:url('fonts/telaviv-brutalist-regular.woff2') format('woff2');
    font-weight:351 550;font-style:normal;font-display:swap}
  @font-face{font-family:'TelAvivBrutalist';src:url('fonts/telaviv-brutalist-bold.woff2') format('woff2');
    font-weight:551 1000;font-style:normal;font-display:swap}

  :root{
    --page:#060504; --ink:#f5f0e6; --dim:#6b6355;
    --gold:#FDBF2D; --line:rgba(245,240,230,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--page);color:var(--ink);font-family:'TelAvivBrutalist',sans-serif;
    line-height:1.5;overflow:hidden;display:grid;place-items:center;
    padding:clamp(20px,5vw,60px)}
  a{color:inherit;text-decoration:none}

  .logo{position:fixed;top:20px;inset-inline-end:3.4vw;z-index:10;display:block;line-height:0}
  .logo .mark{display:block;height:18px;width:61px;background-color:var(--gold);
    -webkit-mask:url(images/logo-jerbi-white.png) no-repeat center/contain;
    mask:url(images/logo-jerbi-white.png) no-repeat center/contain}

  .wrap{text-align:center;position:relative;z-index:2;max-width:34ch}

  /* ה-404 עצמו — כל ספרה היא span נפרד כדי שאפשר יהיה להפיל אותה בנפרד.
     הרעיון מקומפוננטה 11 בספרייה (אותיות שנופלות בפיזיקה), אבל בלי
     Matter.js: GSAP כבר טעון ומקאשד מהאתר, ו-404 לא מצדיק ספרייה נוספת. */
  .big{display:flex;justify-content:center;gap:clamp(2px,.8vw,10px);
    font-weight:900;letter-spacing:-.04em;line-height:.9;
    font-size:clamp(96px,26vw,260px);color:var(--gold);
    text-shadow:0 8px 60px rgba(253,191,45,.14)}
  .big span{display:inline-block;will-change:transform}

  h1{margin-top:clamp(14px,3vh,28px);font-weight:900;letter-spacing:-.03em;
    line-height:1.14;font-size:clamp(24px,4.4vw,44px)}
  p{margin-top:14px;color:var(--ink);opacity:.72;font-size:clamp(14px,1.5vw,17px)}

  .btns{margin-top:clamp(22px,4vh,38px);display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:14px;
    border-radius:99px;padding:12px 24px;transition:.25s}
  .btn.main{background:var(--gold);color:#141005}
  .btn.main:hover{transform:translateY(-2px)}
  .btn.ghost{border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--gold);color:var(--gold)}

  /* רצפה עדינה שהספרות "נוחתות" עליה */
  .floor{position:fixed;inset-inline:0;bottom:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--line),transparent);z-index:1}

  @media (prefers-reduced-motion: reduce){
    .big span{transform:none !important}
  }
</style>
</head>
<body>

<a class="logo" href="/" aria-label="עומר ג'רבי — לדף הבית"><span class="mark" role="img" aria-label="jerbi."></span></a>
<div class="floor" aria-hidden="true"></div>

<div class="wrap">
  <div class="big" aria-label="404"><span>4</span><span>0</span><span>4</span></div>
  <h1>הדף הזה לא קיים.</h1>
  <p>אולי הקישור נשבר, אולי הכתובת השתנתה. העבודות עצמן במקום.</p>
  <div class="btns">
    <a class="btn main" href="/">לדף הבית ←</a>
    <a class="btn ghost" href="/projects.html">כל הפרויקטים</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js" integrity="sha384-HOvlOYPIs/zjoIkWUGXkVmXsjr8GuZLV+Q+rcPwmJOVZVpvTSXQChiN4t9Euv9Vc" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(function(){
  if (typeof gsap === 'undefined') return;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;

  var digits = document.querySelectorAll('.big span');

  /* כניסה: הספרות נופלות מלמעלה ומתיישבות עם ריבאונד — bounce.out נותן
     את תחושת המשקל בלי מנוע פיזיקה אמיתי. */
  gsap.from(digits, {
    y: function(){ return -window.innerHeight * 0.7; },
    rotation: function(i){ return [-14, 8, -6][i]; },
    opacity: 0,
    duration: 1.15,
    ease: 'bounce.out',
    stagger: 0.09
  });

  gsap.from('.wrap h1, .wrap p, .wrap .btns', {
    y: 22, opacity: 0, duration: .8, stagger: .09, ease: 'power3.out', delay: .5
  });

  /* הספרות נוטות קלות אחרי העכבר — מספיק כדי שהעמוד ירגיש חי,
     בלי שזה יסיח מהכפתורים. */
  var tilt = [];
  digits.forEach(function(d, i){ tilt[i] = gsap.quickTo(d, 'rotation', {duration:.6, ease:'power2.out'}); });
  var lift = [];
  digits.forEach(function(d, i){ lift[i] = gsap.quickTo(d, 'y', {duration:.7, ease:'power2.out'}); });

  window.addEventListener('pointermove', function(e){
    var nx = (e.clientX / window.innerWidth - .5) * 2;
    var ny = (e.clientY / window.innerHeight - .5) * 2;
    digits.forEach(function(d, i){
      tilt[i](nx * (7 + i * 2));
      lift[i](ny * -6);
    });
  }, {passive:true});

  /* לחיצה על הספרות מפילה אותן שוב — ביצה קטנה למי שמשחק */
  document.querySelector('.big').addEventListener('click', function(){
    gsap.fromTo(digits,
      { y: 0 },
      { y: function(){ return -140; }, duration: .34, ease: 'power2.out',
        stagger: .05, yoyo: true, repeat: 1 });
  });
})();
</script>
</body>
</html>
